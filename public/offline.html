<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidak Ada Koneksi — Input Performa Mesin</title>
<style>
    body {
        margin: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #FAF6F1;
        color: #3A3632;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem;
    }
    .box { text-align: center; max-width: 340px; }
    .icon {
        width: 64px; height: 64px; border-radius: 50%;
        background-color: #F4A261;
        display: flex; align-items: center; justify-content: center;
        margin: 0 auto 1.25rem;
        font-size: 1.75rem;
    }
    h1 { font-size: 1.1rem; margin-bottom: .5rem; }
    p { color: #8A8378; font-size: .9rem; line-height: 1.5; margin: 0; }
    button {
        margin-top: 1.5rem;
        background-color: #E07A3F;
        color: #fff;
        border: none;
        padding: .65rem 1.5rem;
        border-radius: 8px;
        font-weight: 600;
        font-size: .9rem;
        cursor: pointer;
    }
</style>
</head>
<body>
    <div class="box">
        <div class="icon">📶</div>
        <h1>Tidak Ada Koneksi</h1>
        <p>Aplikasi ini butuh koneksi ke jaringan kantor untuk mengambil &amp; menyimpan data. Periksa koneksi WiFi Anda, lalu coba lagi.</p>
        <button onclick="location.reload()">Coba Lagi</button>
    </div>
</body>
</html>
